name: release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/railmux/__init__.py').read_text()).group(1))")
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != __version__ $pkg"; exit 1; }
          commit=$(git rev-parse HEAD)
          archive_tip=f1b8cb128bd78831d00d4cc7dfa02453f8bd9700
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            archive/windows-conpty-deprecated:refs/remotes/origin/archive/windows-conpty-deprecated
          git fetch --no-tags origin \
            windows-preview:refs/remotes/origin/windows-preview || true
          [ "$(git rev-parse origin/archive/windows-conpty-deprecated)" = "$archive_tip" ] || {
            echo "::error::archived ConPTY branch moved from its frozen tip"
            exit 1
          }
          if git merge-base --is-ancestor "$archive_tip" "$commit"; then
            echo "::error::archived ConPTY history is not release-eligible"
            exit 1
          fi
          if [[ "$tag" == *.dev* ]]; then
            if git merge-base --is-ancestor "$commit" origin/main; then
              [[ "$tag" =~ ^0\.3\.[0-9]+\.dev[0-9]+$ ]] || {
                echo "::error::main development releases must use the 0.3.x.devN series"
                exit 1
              }
              echo "POSIX/WSL development release from main"
            elif git rev-parse --verify -q origin/windows-preview >/dev/null &&
                 git merge-base --is-ancestor "$commit" origin/windows-preview; then
              [[ "$tag" =~ ^0\.5\.0\.dev[0-9]+$ ]] || {
                echo "::error::Windows-wrapper releases must use the 0.5.0.devN series"
                exit 1
              }
              echo "Windows-wrapper development release from windows-preview"
            else
              echo "::error::development releases must come from main or windows-preview"
              exit 1
            fi
          else
            git merge-base --is-ancestor "$commit" origin/main || {
              echo "::error::final releases must come from main"
              exit 1
            }
          fi

      - name: Render curated release notes
        run: python tools/release_notes.py "$GITHUB_REF_NAME" --output release-notes.md

      - run: python -m pip install --upgrade build twine

      - run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - run: python -m twine check dist/*

      - run: python tools/wheel_smoke.py dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes/

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *.dev* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${prerelease[@]}" \
            --notes-file release-notes/release-notes.md \
            dist/*
