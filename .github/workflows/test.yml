name: test

on:
  push:
    branches:
      - main
      - windows-preview
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python tools/ssh_display_benchmark.py --check
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/wheel_smoke.py dist/*.whl

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-client:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run native Windows client and portable contract tests
        run: >-
          python -m pytest -q
          tests/test_platform.py
          tests/test_config.py
          tests/test_runtime_config.py
          tests/test_ssh_args.py
          tests/test_ssh_compat.py
          tests/test_ssh_display_diagnostics.py
          tests/test_ssh_doctor.py
          tests/test_remote_config.py
          tests/test_mux_backend.py
          tests/test_status_chrome.py
          tests/test_windows_parity_contract.py
          tests/test_winlocal_backend.py
          tests/test_winlocal_compositor.py
          tests/test_winlocal_conpty.py
          tests/test_winlocal_daemon.py
          tests/test_winlocal_history_viewer.py
          tests/test_winlocal_ipc.py
          tests/test_winlocal_real_conpty.py
          tests/test_winlocal_session_store.py
          tests/test_winlocal_virtual_screen.py
          tests/test_wheel_smoke.py
      - name: Run Windows-only launcher and Claude path contracts
        run: >-
          python -m pytest -q
          tests/test_cli.py
          tests/test_discovery.py
          -k "native_windows_dispatches_before_tmux_preflight or windows_project_is_recovered_from_validated_transcript_cwd"
      - name: Build and smoke the Windows wheel
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: |
          python -m build
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python tools/wheel_smoke.py $wheel.FullName

  tmux-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS when missing
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run isolated real-tmux smoke test
        env:
          RAILMUX_RUN_TMUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_tmux_integration.py

  tmux-27-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install tmux 2.7 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison libevent-dev libncurses-dev pkg-config
      - name: Build official tmux 2.7 release
        env:
          TMUX_27_SHA256: 9ded7d100313f6bc5a87404a4048b3745d61f2332f99ec1400a7c4ed9485d452
        run: |
          archive="$RUNNER_TEMP/tmux-2.7.tar.gz"
          source_dir="$RUNNER_TEMP/tmux-2.7-src"
          prefix="$RUNNER_TEMP/tmux-2.7"
          curl -fsSL --retry 3 \
            -o "$archive" \
            https://github.com/tmux/tmux/releases/download/2.7/tmux-2.7.tar.gz
          echo "$TMUX_27_SHA256  $archive" | sha256sum -c -
          mkdir "$source_dir"
          tar -xzf "$archive" -C "$source_dir" --strip-components=1
          cd "$source_dir"
          ./configure --prefix="$prefix"
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Verify compatibility floor
        run: test "$(tmux -V)" = "tmux 2.7"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tmux 2.7 startup and private-server compatibility suite
        env:
          RAILMUX_RUN_TMUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_tmux_integration.py
