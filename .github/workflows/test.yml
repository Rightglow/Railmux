name: test

on:
  push:
    branches:
      - main
      - windows-preview
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python tools/ssh_display_benchmark.py --check
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/wheel_smoke.py dist/*.whl

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-bootstrap:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify bootstrap and delegated-runtime contracts
        run: >-
          python -m pytest -q
          tests/test_windows_bootstrap.py
          tests/test_windows_wrapper_contract.py
          tests/test_release_workflow.py
      - run: railmux --version
      - name: Verify a missing selected runtime fails actionably
        shell: pwsh
        run: |
          $env:RAILMUX_WSL_DISTRO = "railmux-ci-missing"
          railmux doctor
          $runtimeExit = $LASTEXITCODE
          if ($runtimeExit -ne 2) {
            throw "missing WSL runtime returned $runtimeExit instead of 2"
          }
          exit 0
      - name: Build and validate the Windows preview wheel
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: |
          python -m build
          python -m twine check dist/*
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          railmux --version

  tmux-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS when missing
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run isolated real-tmux smoke test
        env:
          RAILMUX_RUN_TMUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_tmux_integration.py

  tmux-27-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install tmux 2.7 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison libevent-dev libncurses-dev pkg-config
      - name: Build official tmux 2.7 release
        env:
          TMUX_27_SHA256: 9ded7d100313f6bc5a87404a4048b3745d61f2332f99ec1400a7c4ed9485d452
        run: |
          archive="$RUNNER_TEMP/tmux-2.7.tar.gz"
          source_dir="$RUNNER_TEMP/tmux-2.7-src"
          prefix="$RUNNER_TEMP/tmux-2.7"
          curl -fsSL --retry 3 \
            -o "$archive" \
            https://github.com/tmux/tmux/releases/download/2.7/tmux-2.7.tar.gz
          echo "$TMUX_27_SHA256  $archive" | sha256sum -c -
          mkdir "$source_dir"
          tar -xzf "$archive" -C "$source_dir" --strip-components=1
          cd "$source_dir"
          ./configure --prefix="$prefix"
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Verify compatibility floor
        run: test "$(tmux -V)" = "tmux 2.7"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tmux 2.7 startup and private-server compatibility suite
        env:
          RAILMUX_RUN_TMUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_tmux_integration.py
