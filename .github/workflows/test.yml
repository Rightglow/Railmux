name: test

on:
  push:
    branches:
      - main
      - windows-preview
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python tools/ssh_display_benchmark.py --check
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/wheel_smoke.py dist/*.whl

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  tmux-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS when missing
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run isolated real-tmux smoke test
        env:
          RAILMUX_RUN_TMUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_tmux_integration.py

  tmux-27-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install tmux 2.7 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison libevent-dev libncurses-dev pkg-config
      - name: Build official tmux 2.7 release
        env:
          TMUX_27_SHA256: 9ded7d100313f6bc5a87404a4048b3745d61f2332f99ec1400a7c4ed9485d452
        run: |
          archive="$RUNNER_TEMP/tmux-2.7.tar.gz"
          source_dir="$RUNNER_TEMP/tmux-2.7-src"
          prefix="$RUNNER_TEMP/tmux-2.7"
          curl -fsSL --retry 3 \
            -o "$archive" \
            https://github.com/tmux/tmux/releases/download/2.7/tmux-2.7.tar.gz
          echo "$TMUX_27_SHA256  $archive" | sha256sum -c -
          mkdir "$source_dir"
          tar -xzf "$archive" -C "$source_dir" --strip-components=1
          cd "$source_dir"
          ./configure --prefix="$prefix"
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Verify compatibility floor
        run: test "$(tmux -V)" = "tmux 2.7"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tmux 2.7 startup and private-server compatibility suite
        env:
          RAILMUX_RUN_TMUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_tmux_integration.py

  windows-bootstrap:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest tomli ruff
      - run: python -m pip install --no-deps -e .
      - name: Verify native bootstrap and contract tests
        run: >-
          python -m pytest -q
          tests/test_windows_bootstrap.py
          tests/test_windows_msys2.py
          tests/test_windows_wrapper_contract.py
          tests/test_provider_paths.py
      - run: python -m ruff check src tests tools
      - run: railmux --version

  windows-msys2-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: >-
            tmux
            python
            python-pip
      - name: Install the checkout in the runtime-owned venv
        shell: msys2 {0}
        run: |
          python -m venv /opt/railmux/venv
          /opt/railmux/venv/bin/python -m pip install --upgrade pip
          /opt/railmux/venv/bin/python -m pip install ".[ssh]"
          tmux -V
          /opt/railmux/venv/bin/railmux --version
      - name: Install the thin native Windows package
        shell: pwsh
        run: python -m pip install --no-deps .
      - name: Probe and enter the real MSYS2 runtime from Windows
        shell: pwsh
        env:
          RAILMUX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          railmux runtime status
          railmux doctor --json
