[limitations]
rolling_repository = "The base archive is hash-pinned and pacman signatures are checked, but repository package versions are not yet snapshot-pinned."
mirror_health = "CI archive Range and package-database checks are advisory because an external mirror outage must not invalidate product behavior; archive transfer is size/hash verified, pacman packages are signature verified and cached across retries, and only exact approved official URLs that passed measurement become active in staged private mirrorlists."
native_server = "A Linux/macOS client may launch the display-protocol server, remote config, or read-only doctor through an already-installed, compatible managed Windows runtime. Remote runtime installation and arbitrary native runtimes remain out of scope."
runtime_bridges = "Clipboard, browser, separate-terminal, self-update ownership, and authenticated remote-config/doctor bridges remain conditional on the local Windows terminal and application policies; the 2026-08-07 owner checklist passed."
unicode_profile = "The managed runtime path and provider history must still be exercised with a real non-ASCII Windows profile name."

[release_validation]
date = "2026-08-14"
candidate = "0.4.0rc21"
scope = "Rc21 keeps the immutable r2 runtime and protocol v16 but replaces rc20's input-timed raw-output gate with the shared SSH VT screen model and changed-row renderer. Both same-session and cross-Terminal-Services Windows Terminal entries keep input immediate and byte-exact, defer sampling through bounded provider synchronized frames, and atomically paint only final changed rows plus one authoritative cursor. Working animation and elapsed time remain live without repainting an unchanged prompt beneath terminal-owned IME pre-edit. CJK width, indexed colour, bracketed paste, focus, mouse, resize, Ctrl-C, copy mode, and bounded OSC 52 remain covered. The supported Windows Terminal route deliberately has no raw-output fallback; a renderer fault stops only the attach client and leaves the workspace/providers alive."
remaining_rc_gate = "On the affected real Windows profile, install rc21 without deleting the managed runtime or provider/lock data. During local Codex Working animation and elapsed-time updates, continuously compose Chinese and confirm pre-edit remains stationary, continuously visible, and separate from Working output; commit several words and confirm they reach the input promptly. Verify the Working timer still advances. Repeat direct output, punctuation A“B”C‘D’E「F」G, large bracketed CJK paste, Ctrl-C in an active provider and in the controller, mouse hover/click/right-click/wheel, tmux live-history copy mode, Preview, OSC 52 copy, wide/narrow/tall/short resize, detach, soft quit, and terminal restoration. Force or naturally exercise the cross-Terminal-Services bridge once if available. The non-ASCII Windows profile-name case remains a documented limitation rather than a 0.4 blocker."

[[scenarios]]
id = "WW-PACKAGE-DISPATCH"
features = ["P01", "P02", "W12", "W13"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_windows_install_log.py", "tests/test_windows_msys2.py", "tests/test_windows_pacman.py", "tests/test_provider_paths.py", "tests/test_release_version.py"]
manual = "Install from native Windows Python 3.10+ under CP936; verify consent, colored extraction/package progress, compact/verbose logs, exact shared-base reuse, pip-cache recovery from a throttled app-wheel transfer, partial-package 403/slow pacman mirror recovery, same-profile HOME, native providers, and exact argv."
evidence = "2026-08-03 dev8: Windows 10 19045, PowerShell 5.1, Python 3.12.10, MSYS2 2026-03-22; all seven phases, extraction/package progress and heartbeats, MSYS-only config, five-source measured pool, verified base/package caches, activation/probe, shared HOME, and native provider discovery passed. Dev9 adds bounded multi-package preflight and terminal-aware styling in automation. Dev11 automation adopts a verified dev10 Railmux-owned base without archive, extraction, pacman, relocation, or legacy-marker changes; the two install commands use the final POSIX app path before atomic marker publication, and interrupted markerless layers recover safely. 2026-08-04 real Windows 10/Python 3.12 upgraded dev9 through the three-phase path, recovered an intentionally markerless app layer, ran status and MSYS doctor as dev11 with native providers, retained the legacy marker, and measured a 22.4 MiB dev11 app within the 584.4 MiB adopted tree. A separate user machine then reached the dev11 app layer through exact base reuse but reproduced a files.pythonhosted.org read timeout. Dev12 automation retries that failure once with the same private pip cache and longer timeout while retaining the prior marker unchanged. The dedicated Windows 10 host installed the local dev12 candidate through the real three-phase shared-base path, used the external pip cache through real MSYS cygpath conversion, skipped archive/extraction/pacman, and reported dev12 plus both native providers from MSYS doctor. Dev24 automation binds new app markers to an exact sorted package identity, reports read-only drift, retains current/previous/process-proven layers, and replans explicit prune operations under the install lock. Dev26 replaces SFX execution with safe in-process extraction of a pinned official tar.xz, with progress, traversal/link/special-file rejection, exact inventory bounds, and compatible reuse of released dev24/dev25 bases. The production extractor matched the complete official archive on Linux and repeated the full extraction from the candidate wheel on native Windows 10/Python 3.12, producing bash.exe and bounded progress. A field install then failed in phase four with 0xC0000135, consistent with an incomplete executable dependency set; dev26 had mapped POSIX 0444/0555 archive modes to NTFS read-only attributes, independently reproduced as Access denied on package-owned bashbug cleanup. A separate isolated Windows 10 dev26 install with no pending base updates completed all seven phases. Dev27 kept all package-owned paths writable and added full-archive native launch/updateability CI, but the affected field install returned the same phase-four code. Dev28 follows the official unattended procedure with at least two fresh-process Syuu passes and exact prompt-based restart recognition. Its first full-archive native gate passed both updates and executable loading, then exposed a private gpg-agent handle blocking cleanup; dev28 stops only daemons attached to the private pacman keyring home after transactions. A second Windows Server 2025 run passed both real update processes, executable loading, agent shutdown, and immediate cleanup, but its repository had no pending core packages. A second field retry showed that the terminated process can lose its final buffered prompt. Dev29 accepts only the observed Windows status plus a newly completed bounded core transaction in the identity-pinned pacman journal and an exact matching old-to-new version change in the local package database; stale, incomplete, non-core, wrong-status, and version-mismatched evidence remains fail-closed. It also protects the active reporter log from retention and makes archive smoke use production mirror selection with an exact approved-source override for reproduction. The dedicated Windows 10 host repeated full extraction, measured both the MSYS2 repository and TUNA selection, completed both update processes, loaded executables, shut down private agents, and cleaned the tree; its network still exposed no pending core update, so the affected field host remains the required real restart validation. A 2026-08-06 Windows 11 Microsoft Store Python field install completed with dev30 from the non-virtualized profile root; phase five then exposed a 300-second reachable-but-slow package source. Dev31 automation upgrades real-package preflight from a 1 KiB availability read to a bounded 256 KiB throughput gate while retaining all-source fallback when none passes. Exact dev10 migration, the classified dev12 retry on the affected user network, and real dev24 cleanup remain manual."

