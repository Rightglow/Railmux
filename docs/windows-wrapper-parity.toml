evidence = "2026-08-05 dev24 candidate: the Linux client reached the real managed MSYS2 server on Windows 10 19045 with --remote-platform windows, negotiated protocol v15, attached, streamed 16 coalesced updates/120 rows, and exited cleanly with Ctrl-]. The same Windows host also used its native dev24 client through OpenSSH back to the managed Windows server, painted five coalesced updates/43 rows, and exited cleanly. Automation covers launch-family fallback/pinning, per-family timeouts, platform hello validation, reconnect argv reuse, and fail-closed Windows update guidance. On 2026-08-12 the same real Windows 10 host installed the local rc14 wheel, reused the verified r2/96-package base and rc13 dependencies without network access, reported current_app/content match/tmux 3.7b, then used the rc14 native client to negotiate protocol v16 against its preinstalled managed localhost, paint three coalesced updates/28 rows, and restore the terminal after Ctrl-]. Provider input, IME, resize, reconnect interruption, and macOS origin remain manual."

