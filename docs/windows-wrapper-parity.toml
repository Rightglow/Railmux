[[scenarios]]
id = "WW-LIFECYCLE"
features = ["W09", "W10", "W11", "W14", "S19"]
automation = ["tests/test_windows_bootstrap.py"]
manual = "Close/reopen the outer terminal, detach, soft restart, resize, interrupt, and verify providers persist and terminal modes recover."
evidence = "2026-08-03 spike: detached Claude tmux pane survived closing and reopening the PowerShell/SSH client; full Railmux lifecycle not run."

[[scenarios]]
id = "WW-SSH-POSIX"
