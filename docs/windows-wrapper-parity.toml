[limitations]
managed_msys2 = "Not implemented; no fallback runtime is installed yet."
wsl_provisioning = "The selected WSL distribution must already contain Railmux."
native_history = "Native Windows provider histories are not migrated into the delegated runtime."
runtime_bridges = "Config, doctor, update, clipboard, browser, and separate-terminal integration require per-runtime validation."

[[scenarios]]
id = "WW-PACKAGE-DISPATCH"
features = ["W12", "W13"]
automation = ["tests/test_windows_bootstrap.py"]
manual = "Install with Windows Python 3.10+ under a CP936 locale; verify version, actionable failure, and WSL handoff without a traceback."
evidence = "2026-08-03, Windows 10 19045 / PowerShell 5.1 / Python 3.12.10 on 4u4g-gen-0007, source 0be2d1c: user install, console/module version, CP936, lazy import, root help, system WSL stub, and missing-runtime exit passed; enabled-WSL handoff not run."

[[scenarios]]
id = "WW-PREVIEW-OPEN"
features = ["P04", "P05", "P06"]
automation = []
manual = "Preview and open authenticated Codex and Claude sessions in Windows Terminal through the delegated runtime."
evidence = "not-run"

[[scenarios]]
id = "WW-RESIZE-REFLOW"
features = ["W02", "W04", "W05"]
automation = []
manual = "Resize wide, narrow, tall, and short while each provider renders; verify native tmux reflow and restored layout."
evidence = "not-run"

[[scenarios]]
id = "WW-MOUSE-CHROME"
features = ["P06", "W05", "W06"]
automation = []
manual = "Verify wheel, sidebar scrolling, double-click, right-click menus, responsive dialogs, Mode, Layout, compact pages, and status actions."
