[limitations]
rolling_repository = "The base archive is hash-pinned and pacman signatures are checked, but repository package versions are not yet snapshot-pinned."
native_server = "Providers and SSH servers on native Windows are out of scope."
runtime_bridges = "Clipboard, browser, separate-terminal, self-update, and remote-config bridges still require real Windows validation."
unicode_profile = "The managed runtime path and provider history must still be exercised with a real non-ASCII Windows profile name."

[[scenarios]]
id = "WW-PACKAGE-DISPATCH"
features = ["P01", "P02", "W12", "W13"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_windows_msys2.py", "tests/test_provider_paths.py"]
manual = "Install from native Windows Python 3.10+ under CP936; verify consent, UTF-8 state, same-profile HOME, native providers, and exact argv."
evidence = "2026-08-03 spike: Windows 10 19045, PowerShell 5.1, Python 3.12.10, MSYS2 2026-03-22; shared HOME and native Codex/Claude discovery passed. Final dev4 installer still pending."

[[scenarios]]
id = "WW-PREVIEW-OPEN"
features = ["P04", "P05", "P06"]
automation = ["tests/test_path_codec.py", "tests/test_codex_index.py"]
manual = "Preview, scroll, close, and open authenticated native Codex and Claude sessions, including sessions created outside Railmux."
evidence = "2026-08-03 spike launched native Codex 0.146.0 and Claude Code 2.1.220 in MSYS tmux; authenticated restore/preview not run."

[[scenarios]]
id = "WW-RESIZE-REFLOW"
features = ["W02", "W04", "W05"]
automation = []
manual = "Resize wide, narrow, tall, and short while each provider renders; verify reflow, compact pages, bottom chrome, and restored layout."
evidence = "not-run"

[[scenarios]]
id = "WW-MOUSE-CHROME"
features = ["P06", "W05", "W06"]
automation = []
manual = "Verify preview wheel, sidebar scrolling, double-click, right-click menus, responsive dialogs, Mode, Layout, status actions, and selection."
