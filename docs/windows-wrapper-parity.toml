[[scenarios]]
id = "WW-MOUSE-CHROME"
features = ["P03", "P06", "W05", "W06"]
automation = ["tests/test_cli.py", "tests/test_tmux_server.py", "tests/test_windows_attach_relay.py", "tests/test_tmux_ctl.py", "tests/test_tmux_binding_manager.py", "tests/test_tmux_integration.py", "tests/test_fast_display_selection.py", "tests/test_fast_display_terminal.py", "tests/test_fast_display_history.py", "tests/test_fullscreen_binding.py", "tests/test_projects_pane.py", "tests/test_project_favorites.py", "tests/test_sidebar.py"]
manual = "Verify preview wheel, sidebar scrolling, double-click, right-click menus, responsive dialogs, Mode, Layout, status actions, selection, and a stable hardware cursor throughout an active Codex turn."
evidence = "2026-08-03 dev9 candidate: a real isolated official tmux 3.7b server received Mode through range=control|0, preserved pane-range zoom, and restored all root bindings. Dev16 automation proves that SSH hover, drag, and click feedback repaint only affected rows without a clear-screen frame and suppress redundant cursor-visibility writes. On 2026-08-05 an isolated dev17 candidate on the real Windows 10/MSYS2 host deferred crash-safe wheel/function/status lease preparation past first paint, then exposed owned F8/F9, status-control, right-click, and wheel root bindings; empty-session app restore measured 2.3s (index 0.0s, pane recovery 0.6s), down from controlled 9.4s before batching. Dev19 recreated the real outer UI on a live older server, installed current control-range bindings, reprojected the first visible status-right as control|2, and F6 copied its exact source into the tmux clipboard buffer with acknowledgement. Dev35 adds exact Projects-row right-click routing, separate atomic project favorites, stable favorite pinning, absolute-path clipboard actions, and behavior-preservation coverage for rows without context ownership. Post-rc2 automation gates the managed Windows Terminal marker into tmux's per-client synchronized-output feature on both direct and bridge attaches without carrying the opaque marker or accepting option-shaped feature input. A 2026-08-10 Windows Terminal 1.24 trace proved 444/444 Codex synchronized frames paired while 420/443 adjacent frames ended on different visible cursor rows and most cursor visibility transitions remained outside the frame. Rc11 replaces rc10's broad process-local animation disable with a same-session private PTY that leaves ordinary output byte-exact, coalesces only observed DECTCEM visibility during a visibility burst, keeps injection outside partial CSI and opaque OSC/DCS payload, restores the provider-requested final state after quiet, drains the terminal restore tail, and fails back to direct attach. Rc15 automation defers uncontradicted hides through the quiet boundary, suppresses all physical hide/show transitions in a long paired repaint stream, pins prompt rows while accepting same-row caret columns, treats synchronized output as a latch, repays overridden positions inside the next frame or before relative output, and covers resize, persistent-hidden, split-control, OSC, real-PTY, and fail-safe paths. Desktop Windows Terminal IME composition, pointer, system-clipboard receipt, Working timer, and final active-turn cursor stability remain manual."

[[scenarios]]
id = "WW-LIFECYCLE"
features = ["W09", "W10", "W11", "W14", "S19"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_windows_tmux_lifecycle.py", "tests/test_windows_ui_transition.py", "tests/test_restart_state.py", "tests/test_fullscreen_binding.py", "tests/test_cli.py", "tests/test_tmux_server.py"]
manual = "Close/reopen the outer terminal, detach, soft restart, resize, interrupt, and verify providers persist and terminal modes recover."
evidence = "2026-08-03 dev10 candidate: reproduced the MSYS2 3.7b abandoned socket after zero-session soft quit, cleaned it only after exact sole-session/sole-pane proof, and relaunched the same isolated label; live and replaced socket boundaries are automated. Dev17 automation cancels background lease acquisition before the next lease begins, joins the non-daemon worker, and restores wheel/function bindings only from the main teardown owner. On 2026-08-05 the dev18 candidate soft-quit the real Windows 10/MSYS2 UI while a detached provider tmux session kept the dedicated server alive, proved the outer session absent, recreated only that outer session through the same server, entered it, and detached normally; provider/session files were not changed. Dev19 repeated the missing-outer recovery with an unresolved live Codex process, passed only the bounded current runtime/app identity to the new pane, atomically reclaimed the exact orphan marker, and detached the final view with the provider still alive. Dev20 soft-quit that real UI again with the provider retained, entered through a 137x39 SSH PTY, and observed the recreated tmux window at 137x39 on its first query rather than the detached 80x24 default before detaching normally. Dev24 automation covers exact content-bound ready publication, cooperative provider-pane return, expiring requests, and a strict no-kill boundary for released dev11-dev23 controllers; the real dev23-to-dev24 transition remains manual. Rc9 automation recognizes released schema-1 and current schema-2 managed generations, blocks attributable old runtime/provider process trees before probing the current runtime, treats failed or ambiguous native inventory as unknown, directly supervises one old tmux client with a Windows timeout, preserves doctor/config access, and never deletes provider or lease state."

[[scenarios]]
id = "WW-ENTRY-SURFACES"
features = ["P01", "P03", "W01", "W09", "W10", "W11", "W14"]
automation = ["tests/test_cli.py", "tests/test_windows_attach_relay.py", "tests/test_tmux_integration.py"]
manual = "Create and detach one workspace from Windows Terminal, attach it after an ordinary OpenSSH login to the same Windows account, then reverse the origin; verify both surfaces see the same immutable tmux session, input, output, resize, detach, provider panes, and histories."
evidence = "dev15 automation covers direct-first gating, exact server/session revalidation, nonce-authenticated private endpoint cleanup, transparent byte/resize/exit framing, and a real isolated tmux PTY attach/detach including the terminal-restore tail. On 2026-08-04 the dedicated Windows 10 19045 host installed the local dev15 wheel on its reused base; ordinary OpenSSH login followed by railmux entered and detached the existing workspace, and a forced real-MSYS2 bridge completed server-origin PTY attach, HMAC handshake, UI transport, C-b d, terminal restoration, and exit 0 while doctor retained the same healthy server. On 2026-08-05 the dev18 candidate recreated a missing outer UI on that unchanged server after Soft Quit and entered it from OpenSSH. Dev19 verified that this detached outer inherited the exact current app identity rather than the older server environment; automation suppresses only the managed direct-client error on successful bridge fallback and retains an actionable unavailable-bridge error. Cross-Terminal-Services automatic fallback remains a desktop Windows Terminal manual check."

[[scenarios]]
id = "WW-SSH-POSIX"
features = ["S01", "S04", "S06", "S08", "S09", "S11", "S12", "S17"]
automation = ["tests/test_fast_display_protocol.py", "tests/test_fast_display_selection.py", "tests/test_fast_display_terminal.py", "tests/test_fast_display_history.py", "tests/test_fast_display_bootstrap.py", "tests/test_fast_display_server.py", "tests/test_session_lease.py", "tests/test_tmux_integration.py"]
manual = "Run railmux ssh from Windows to Linux and macOS/Unix; verify restore, reconnect, three-row history wheel steps, mouse, paste, resize, active-display Ctrl-C delivery, and Ctrl-]."
evidence = "Dev16 automation covers row-local hover/selection repaint and provider-session lease conflicts. The candidate also entered its Windows workspace from an ordinary OpenSSH client and detached cleanly. Dev21 automation delivers eight SGR wheel reports in one local input batch, preserves all eight agent-history rows with one final overlay paint, restores live once when a downward batch reaches the bottom, and retains the existing one-per-direction bound for wheel input forwarded to remote sidebar/modal owners. Dev22 parses provider-emitted rollback evidence, requires its count to advance before canonical transcript fallback, and downgrades released heuristic markers to raw pane history; ordinary Codex continuation and compaction children remain styled raw SSH history. Rc5 automation maps managed-Windows local-history events to the native three-row step while preserving the POSIX one-row contract, converts an active native console Ctrl-C signal to bounded remote input, retains setup cancellation, and distinguishes a 300-second approved install timeout from installer exit. Rc9 automation round-trips a 120KB-plus CJK bracketed paste across terminal and protocol chunk boundaries, rejects matching rows inside both live viewports as false history anchors after full hot-suffix replacement, and preserves a prior live row once it genuinely enters scrollback. Rc14 extends that paste round trip across split begin/end boundaries and embedded Ctrl-], Page, and mouse-shaped bytes, and separately proves a 180KB-plus CJK paste remains byte-exact through the native private PTY. Rc17 enables bracketed paste from transport entry rather than sampled remote mode, gives a slow split marker a bounded completion grace, and passes a real isolated tmux/raw-PTY round trip for a fragmented 20-line CJK paste. Windows-origin railmux ssh to a Linux/macOS target remains an end-to-end manual check."

[[scenarios]]
