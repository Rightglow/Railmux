[limitations]
rolling_repository = "The base archive is hash-pinned and pacman signatures are checked, but repository package versions are not yet snapshot-pinned."
mirror_health = "CI archive Range and package-database checks are advisory because an external mirror outage must not invalidate product behavior; archive transfer is size/hash verified, pacman packages are signature verified and cached across retries, and only exact approved official URLs that passed measurement become active in staged private mirrorlists."
native_server = "A Linux/macOS client may launch the display-protocol server, remote config, or read-only doctor through an already-installed, compatible managed Windows preview runtime. Remote runtime installation, arbitrary native runtimes, and hosted cross-platform CI remain out of scope."
runtime_bridges = "Clipboard, browser, separate-terminal, self-update ownership, and authenticated remote-config/doctor bridges still require real Windows validation."
unicode_profile = "The managed runtime path and provider history must still be exercised with a real non-ASCII Windows profile name."

[[scenarios]]
id = "WW-PACKAGE-DISPATCH"
features = ["P01", "P02", "W12", "W13"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_windows_install_log.py", "tests/test_windows_msys2.py", "tests/test_windows_pacman.py", "tests/test_provider_paths.py"]
manual = "Install from native Windows Python 3.10+ under CP936; verify consent, colored extraction/package progress, compact/verbose logs, exact shared-base reuse, pip-cache recovery from a throttled app-wheel transfer, partial-package 403/slow pacman mirror recovery, same-profile HOME, native providers, and exact argv."
evidence = "2026-08-03 dev8: Windows 10 19045, PowerShell 5.1, Python 3.12.10, MSYS2 2026-03-22; all seven phases, extraction/package progress and heartbeats, MSYS-only config, five-source measured pool, verified base/package caches, activation/probe, shared HOME, and native provider discovery passed. Dev9 adds bounded multi-package preflight and terminal-aware styling in automation. Dev11 automation adopts a verified dev10 Railmux-owned base without archive, extraction, pacman, relocation, or legacy-marker changes; the two install commands use the final POSIX app path before atomic marker publication, and interrupted markerless layers recover safely. 2026-08-04 real Windows 10/Python 3.12 upgraded dev9 through the three-phase path, recovered an intentionally markerless app layer, ran status and MSYS doctor as dev11 with native providers, retained the legacy marker, and measured a 22.4 MiB dev11 app within the 584.4 MiB adopted tree. A separate user machine then reached the dev11 app layer through exact base reuse but reproduced a files.pythonhosted.org read timeout. Dev12 automation retries that failure once with the same private pip cache and longer timeout while retaining the prior marker unchanged. The dedicated Windows 10 host installed the local dev12 candidate through the real three-phase shared-base path, used the external pip cache through real MSYS cygpath conversion, skipped archive/extraction/pacman, and reported dev12 plus both native providers from MSYS doctor. Dev24 automation binds new app markers to an exact sorted package identity, reports read-only drift, retains current/previous/process-proven layers, and replans explicit prune operations under the install lock. Dev26 replaces SFX execution with safe in-process extraction of a pinned official tar.xz, with progress, traversal/link/special-file rejection, exact inventory bounds, and compatible reuse of released dev24/dev25 bases. The production extractor matched the complete official archive on Linux and repeated the full extraction from the candidate wheel on native Windows 10/Python 3.12, producing bash.exe and bounded progress. A field install then failed in phase four with 0xC0000135, consistent with an incomplete executable dependency set; dev26 had mapped POSIX 0444/0555 archive modes to NTFS read-only attributes, independently reproduced as Access denied on package-owned bashbug cleanup. A separate isolated Windows 10 dev26 install with no pending base updates completed all seven phases. Dev27 kept all package-owned paths writable and added full-archive native launch/updateability CI, but the affected field install returned the same phase-four code. Dev28 follows the official unattended procedure with at least two fresh-process Syuu passes and exact prompt-based restart recognition. Its first full-archive native gate passed both updates and executable loading, then exposed a private gpg-agent handle blocking cleanup; dev28 stops only daemons attached to the private pacman keyring home after transactions. A second Windows Server 2025 run passed both real update processes, executable loading, agent shutdown, and immediate cleanup, but its repository had no pending core packages. A second field retry showed that the terminated process can lose its final buffered prompt. Dev29 accepts only the observed Windows status plus a newly completed bounded core transaction in the identity-pinned pacman journal and an exact matching old-to-new version change in the local package database; stale, incomplete, non-core, wrong-status, and version-mismatched evidence remains fail-closed. It also protects the active reporter log from retention and makes archive smoke use production mirror selection with an exact approved-source override for reproduction. The dedicated Windows 10 host repeated full extraction, measured both the MSYS2 repository and TUNA selection, completed both update processes, loaded executables, shut down private agents, and cleaned the tree; its network still exposed no pending core update, so the affected field host remains the required real restart validation. A 2026-08-06 Windows 11 Microsoft Store Python field install completed with dev30 from the non-virtualized profile root; phase five then exposed a 300-second reachable-but-slow package source. Dev31 automation upgrades real-package preflight from a 1 KiB availability read to a bounded 256 KiB throughput gate while retaining all-source fallback when none passes. Exact dev10 migration, the classified dev12 retry on the affected user network, and real dev24 cleanup remain manual."

[[scenarios]]
id = "WW-UPGRADE-FEEDBACK"
features = ["W06", "W13"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_windows_install_log.py", "tests/test_windows_msys2.py", "tests/test_sessions_pane.py", "tests/test_focus_highlight.py"]
manual = "Upgrade one verified Store-Python installation from dev31, confirm phase 2 reports local dependency reuse without PyPI, runtime status exposes the profile-root log path, PowerShell renders punctuation without mojibake, and a stopped Claude row highlights before its preview appears."
evidence = "Dev32 automation copies only bounded non-link dependency roots from an exact-version-probed prior app, overlays the current native Railmux payload, requires pip check/import/version validation, and proves an invalid seed is removed before the existing cached PyPI fallback. It also covers Store-Python log-path discovery, a PowerShell-compatible UTF-8 signature, immediate pointer acknowledgement, and preservation of the direct keyboard Preview path. Real Store-Python timing and pointer latency remain manual."

[[scenarios]]
id = "WW-PREVIEW-OPEN"
features = ["P04", "P05", "P06"]
automation = ["tests/test_path_codec.py", "tests/test_codex_index.py", "tests/test_session_lease.py", "tests/test_transcript.py", "tests/test_focus_highlight.py", "tests/test_tmux_integration.py"]
manual = "Preview, scroll, close, and open authenticated native Codex and Claude sessions, including sessions created outside Railmux."
evidence = "2026-08-03 spike launched native Codex 0.146.0 and Claude Code 2.1.220 in MSYS tmux. The 2026-08-05 dev16 candidate passed real-MSYS holder transfer/release and a real shared-scratch two-host conflict test with immediate owner visibility. Dev33 automation reads a bounded direct-file tail without an external process, proves that repeat Preview performs one pane replacement without transport/marker/chrome revalidation, preserves the complete first live-to-preview boundary, and respawns two real transcript viewers in one isolated tmux pane without stale content. Authenticated native-provider preview remains manual."

[[scenarios]]
id = "WW-RESIZE-REFLOW"
features = ["W02", "W04", "W05"]
automation = ["tests/test_cli.py"]
manual = "Resize wide, narrow, tall, and short while each provider renders; verify reflow, compact pages, bottom chrome, and restored layout."
evidence = "Dev31 automation supervises the managed-Windows direct tmux client from the existing outer watchdog, notifies a height-only native-console resize with SIGWINCH, and proves the POSIX attach path remains untouched. Real Windows Terminal resize/reflow remains manual."

[[scenarios]]
id = "WW-MOUSE-CHROME"
features = ["P06", "W05", "W06"]
automation = ["tests/test_tmux_ctl.py", "tests/test_tmux_binding_manager.py", "tests/test_tmux_integration.py", "tests/test_fast_full_window.py", "tests/test_fullscreen_binding.py"]
manual = "Verify preview wheel, sidebar scrolling, double-click, right-click menus, responsive dialogs, Mode, Layout, status actions, and selection."
evidence = "2026-08-03 dev9 candidate: a real isolated official tmux 3.7b server received Mode through range=control|0, preserved pane-range zoom, and restored all root bindings. Dev16 automation proves that SSH hover, drag, and click feedback repaint only affected rows without a clear-screen frame and suppress redundant cursor-visibility writes. On 2026-08-05 an isolated dev17 candidate on the real Windows 10/MSYS2 host deferred crash-safe wheel/function/status lease preparation past first paint, then exposed owned F8/F9, status-control, right-click, and wheel root bindings; empty-session app restore measured 2.3s (index 0.0s, pane recovery 0.6s), down from controlled 9.4s before batching. Dev19 recreated the real outer UI on a live older server, installed current control-range bindings, reprojected the first visible status-right as control|2, and F6 copied its exact source into the tmux clipboard buffer with acknowledgement. Desktop Windows Terminal pointer and system-clipboard receipt remain manual."

[[scenarios]]
id = "WW-LIFECYCLE"
features = ["W09", "W10", "W11", "W14", "S19"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_windows_tmux_lifecycle.py", "tests/test_windows_ui_transition.py", "tests/test_restart_state.py", "tests/test_fullscreen_binding.py", "tests/test_cli.py", "tests/test_tmux_server.py"]
manual = "Close/reopen the outer terminal, detach, soft restart, resize, interrupt, and verify providers persist and terminal modes recover."
evidence = "2026-08-03 dev10 candidate: reproduced the MSYS2 3.7b abandoned socket after zero-session soft quit, cleaned it only after exact sole-session/sole-pane proof, and relaunched the same isolated label; live and replaced socket boundaries are automated. Dev17 automation cancels background lease acquisition before the next lease begins, joins the non-daemon worker, and restores wheel/function bindings only from the main teardown owner. On 2026-08-05 the dev18 candidate soft-quit the real Windows 10/MSYS2 UI while a detached provider tmux session kept the dedicated server alive, proved the outer session absent, recreated only that outer session through the same server, entered it, and detached normally; provider/session files were not changed. Dev19 repeated the missing-outer recovery with an unresolved live Codex process, passed only the bounded current runtime/app identity to the new pane, atomically reclaimed the exact orphan marker, and detached the final view with the provider still alive. Dev20 soft-quit that real UI again with the provider retained, entered through a 137x39 SSH PTY, and observed the recreated tmux window at 137x39 on its first query rather than the detached 80x24 default before detaching normally. Dev24 automation covers exact content-bound ready publication, cooperative provider-pane return, expiring requests, and a strict no-kill boundary for released dev11-dev23 controllers; the real dev23-to-dev24 transition remains manual."

[[scenarios]]
id = "WW-ENTRY-SURFACES"
features = ["P01", "P03", "W01", "W09", "W10", "W11", "W14"]
automation = ["tests/test_cli.py", "tests/test_windows_attach_relay.py", "tests/test_tmux_integration.py"]
manual = "Create and detach one workspace from Windows Terminal, attach it after an ordinary OpenSSH login to the same Windows account, then reverse the origin; verify both surfaces see the same immutable tmux session, input, output, resize, detach, provider panes, and histories."
evidence = "dev15 automation covers direct-first gating, exact server/session revalidation, nonce-authenticated private endpoint cleanup, transparent byte/resize/exit framing, and a real isolated tmux PTY attach/detach including the terminal-restore tail. On 2026-08-04 the dedicated Windows 10 19045 host installed the local dev15 wheel on its reused base; ordinary OpenSSH login followed by railmux entered and detached the existing workspace, and a forced real-MSYS2 bridge completed server-origin PTY attach, HMAC handshake, UI transport, C-b d, terminal restoration, and exit 0 while doctor retained the same healthy server. On 2026-08-05 the dev18 candidate recreated a missing outer UI on that unchanged server after Soft Quit and entered it from OpenSSH. Dev19 verified that this detached outer inherited the exact current app identity rather than the older server environment; automation suppresses only the managed direct-client error on successful bridge fallback and retains an actionable unavailable-bridge error. Cross-Terminal-Services automatic fallback remains a desktop Windows Terminal manual check."

[[scenarios]]
id = "WW-SSH-POSIX"
features = ["S01", "S04", "S06", "S08", "S09", "S11", "S12", "S17"]
automation = ["tests/test_fast_full_window.py", "tests/test_session_lease.py"]
manual = "Run railmux ssh from Windows to Linux and macOS/Unix; verify restore, reconnect, history, mouse, paste, resize, and Ctrl-]."
evidence = "Dev16 automation covers row-local hover/selection repaint and provider-session lease conflicts. The candidate also entered its Windows workspace from an ordinary OpenSSH client and detached cleanly. Dev21 automation delivers eight SGR wheel reports in one local input batch, preserves all eight agent-history rows with one final overlay paint, restores live once when a downward batch reaches the bottom, and retains the existing one-per-direction bound for wheel input forwarded to remote sidebar/modal owners. Dev22 parses provider-emitted rollback evidence, requires its count to advance before canonical transcript fallback, and downgrades released heuristic markers to raw pane history; ordinary Codex continuation and compaction children remain styled raw SSH history. Windows-origin railmux ssh to a Linux/macOS target remains an end-to-end manual check."

[[scenarios]]
id = "WW-SSH-WINDOWS"
features = ["S01", "S02", "S04", "S05", "S06", "S07", "S19"]
automation = ["tests/test_fast_full_window.py"]
manual = "From Linux and macOS run railmux ssh --remote-platform windows to an OpenSSH-enabled Windows account with the matching managed preview runtime; verify attach, frames, input, resize, reconnect, Ctrl-], and unchanged provider histories."
evidence = "2026-08-05 dev24 candidate: the Linux client reached the real managed MSYS2 server on Windows 10 19045 with --remote-platform windows, negotiated protocol v15, attached, streamed 16 coalesced updates/120 rows, and exited cleanly with Ctrl-]. The same Windows host also used its native dev24 client through OpenSSH back to the managed Windows server, painted five coalesced updates/43 rows, and exited cleanly. Automation covers launch-family fallback/pinning, per-family timeouts, platform hello validation, reconnect argv reuse, and fail-closed Windows update guidance. Provider input, resize, reconnect interruption, and macOS origin remain manual."

[[scenarios]]
id = "WW-RUNTIME-BRIDGES"
features = ["W07", "W12", "W13", "S03", "S13", "S15", "S16", "S20"]
automation = ["tests/test_windows_bootstrap.py", "tests/test_config_cli.py", "tests/test_remote_config.py", "tests/test_diagnostics.py", "tests/test_ssh_doctor.py", "tests/test_fast_full_window.py"]
manual = "Validate config, doctor, Ask Railmux, local update ownership, clipboard, browser, separate terminal, and remote config in managed MSYS2."
evidence = "Dev24 automation forwards every local/remote config and doctor form through the native bootstrap, pins POSIX/direct command families across both config phases, refuses POSIX installation and in-app self-update for managed Windows, emits bounded runtime/launch-family doctor fields, and keeps remote doctor pre-attach/read-only. On the real Windows 10 host, local config opened read-only and exited cleanly, local doctor emitted schema 4 with the exact managed identity, Linux-to-Windows remote doctor emitted schema 3/direct/windows-msys2, and interactive remote config completed both authenticated phases without changing settings. The native Windows client repeated remote doctor and both config phases through localhost OpenSSH. Clipboard/browser/separate-terminal bridges and the PowerShell update handoff remain manual."
