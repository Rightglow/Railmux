manual = "Upgrade one verified Store-Python installation from dev31, confirm phase 2 reports local dependency reuse without PyPI, runtime status exposes the profile-root log path, PowerShell renders punctuation without mojibake, and a stopped Claude row highlights before its preview appears."
evidence = "Dev32 automation copies only bounded non-link dependency roots from an exact-version-probed prior app, overlays the current native Railmux payload, requires pip check/import/version validation, and proves an invalid seed is removed before the existing cached PyPI fallback. It also covers Store-Python log-path discovery, a PowerShell-compatible UTF-8 signature, immediate pointer acknowledgement, and preservation of the direct keyboard Preview path. Real Store-Python timing and pointer latency remain manual."

[[scenarios]]
id = "WW-PREVIEW-OPEN"
features = ["P04", "P05", "P06"]
automation = ["tests/test_path_codec.py", "tests/test_codex_index.py", "tests/test_session_lease.py", "tests/test_transcript.py", "tests/test_focus_highlight.py", "tests/test_tmux_integration.py"]
manual = "Preview, scroll, close, and open authenticated native Codex and Claude sessions, including sessions created outside Railmux."
evidence = "2026-08-03 spike launched native Codex 0.146.0 and Claude Code 2.1.220 in MSYS tmux. The 2026-08-05 dev16 candidate passed real-MSYS holder transfer/release and a real shared-scratch two-host conflict test with immediate owner visibility. Dev33 automation reads a bounded direct-file tail without an external process, proves that repeat Preview performs one pane replacement without transport/marker/chrome revalidation, preserves the complete first live-to-preview boundary, and respawns two real transcript viewers in one isolated tmux pane without stale content. Dev34 renders the bounded view completely into an anonymous seekable file before the pager starts, and proves a modern-tmux running-session switch with coherent snapshots, journaled/guarded batches, immutable old-home/new-display postconditions, foreign-marker preservation, concurrent-target fallback, and an unchanged-target one-snapshot path. The real Windows 10 host upgraded dev33 to the candidate without network access, started an isolated empty workspace through an ordinary OpenSSH PTY in 2.6 seconds (0.4 seconds pane recovery), and detached normally. Rc9 automation requires holder ready plus a fresh exact-owner OS-lock probe, never treats pending repair as protected, bounds stuck repair visibility, and separates provider/topology/cleanup failures without exposing pane output. Rc10 freezes the full repair anchor before a worker can publish a partial held set, persists that non-authoritative intent, waits for one stable managed-Windows provider birth token, and distinguishes early helper exit from a real ten-second readiness timeout. The rc10 wheel installed by offline app-layer reuse on the real Windows 10 host, completed 24 consecutive isolated holder transfers with exact lock verification, generated the then-current process-local reduced-motion argv, restored an empty UI in 2.6 seconds over an ordinary OpenSSH PTY, and detached normally. Rc11 automation preserves provider animation and Working timers, creates the detached provider at the exact target geometry before replay, and renders repeated wide-glyph continuation cells once. Rc16 automation preserves final screen cells while coalescing repeated anchored prompt rows, bounds held partial rows, retains source order across split controls, treats UTF-8 continuation bytes inside OSC as text, and proves native punctuation input remains byte-exact. A post-rc16 Windows boundary probe proved the exact `A“B”C‘D’E「F」G` fixture byte-clean through direct tmux, LocalPtyClient, and their combined path; rc17 forces the remaining native-provider boundary onto child-local ConPTY even when a parent Git/MSYS environment exported `disable_pcon`. Rc17 also preserves final cells while retaining only the latest changed prompt row through a repaint burst and settles once at quiet. On 2026-08-14 the dedicated Windows 10 host upgraded rc14 to rc17 through offline dependency reuse, normalized a simulated inherited `disable_pcon`, delivered the exact punctuation fixture through an isolated managed tmux pane to native Windows Python, restored an isolated UI in 2.9 seconds, and soft-quit with no sessions. Rc18 automation interleaves eight 20 FPS Working frames with raw letter/DEL IME-like input, proves three EL spellings cannot repaint an unchanged visible prompt, suppresses repeated cursor shape/blink state, and fails open after the complete bounded split-row interval. Rc19 automation changes the provider prompt across successive letter/DEL composition-shaped reads, proves no intermediate prompt repaint reaches the terminal while all Working rows remain live, publishes only the newest prompt including `“”‘’「」` after the independent 100 ms input-quiet deadline, preserves that exact punctuation fixture in both ordinary and bracketed relay input, keeps Enter-driven screen transitions authoritative, and discards guarded geometry on resize. The rc21 wheel reused the immutable r2 base without network access on the dedicated Windows 10 host, started an isolated semantic Windows Terminal workspace through the real managed runtime, accepted keyboard quit, and restored terminal modes; the final safety delta bounds malformed synchronized frames and missing-renderer dependencies in automation. Authenticated Codex/Claude IME composition and perceptual timing remain manual."

