schema = 1

# Every stable SUPPORT_MATRIX feature ID must appear exactly once here.  CI
# fails when the shared product inventory grows without an explicit native
# Windows disposition.  A disposition describes implementation ownership, not
# a support promotion: real-provider/Windows-Terminal checks remain manual.
[features]
P01 = "shared-contract"
P02 = "shared-contract"
P03 = "shared-contract"
P04 = "native-adapter"
P05 = "native-adapter"
P06 = "native-adapter"
P07 = "shared-contract"
P08 = "native-adapter"
P09 = "shared-contract"
P10 = "shared-contract"
P11 = "shared-contract"
P12 = "native-adapter"
W01 = "native-equivalent"
W02 = "native-adapter"
W03 = "native-adapter"
W04 = "native-adapter"
W05 = "native-adapter"
W06 = "shared-contract"
W07 = "shared-contract"
W08 = "limited"
W09 = "native-adapter"
W10 = "native-adapter"
W11 = "native-adapter"
W12 = "shared-contract"
W13 = "native-adapter"
W14 = "native-equivalent"
S01 = "shared-contract"
S02 = "shared-contract"
S03 = "limited"
S04 = "native-adapter"
S05 = "shared-contract"
S06 = "native-adapter"
S07 = "shared-contract"
S08 = "shared-contract"
S09 = "native-adapter"
S10 = "shared-contract"
S11 = "native-adapter"
S12 = "native-adapter"
S13 = "native-adapter"
S14 = "native-adapter"
S15 = "native-adapter"
S16 = "native-adapter"
S17 = "native-adapter"
S18 = "not-applicable"
